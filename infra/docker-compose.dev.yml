# Local development — infrastructure only (run apps via pnpm dev)

services:
  postgres:
    image: postgres:16-alpine
    container_name: rkyves-dev-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rkyves
      POSTGRES_PASSWORD: rkyves
      POSTGRES_DB: rkyves_control
    volumes:
      - dev-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rkyves-dev-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: rkyves-dev-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rkyves
      MINIO_ROOT_PASSWORD: rkyves-secret
    command: server /data --console-address ":9001"
    volumes:
      - dev-minio:/data

volumes:
  dev-db:
  dev-minio:
